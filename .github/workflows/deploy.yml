name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          source: "."
          target: "~/mac-m1-partner-src"
          rm: true

      - name: Build and deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            SRC_DIR="$HOME/mac-m1-partner-src"
            APP_DIR="$HOME/mac-m1-partner"
            IMAGE="mac-m1-partner:${{ github.sha }}"

            docker build -t "$IMAGE" -t mac-m1-partner:latest "$SRC_DIR"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            cat > .env <<'ENV_EOF'
            ${{ secrets.FILE_ENV }}
            ENV_EOF
            chmod 600 .env

            cat > docker-compose.yml <<'COMPOSE_EOF'
            services:
              postgres:
                image: postgres:17-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_DB: mac
                  POSTGRES_USER: ${DB_USERNAME}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d mac"]
                  interval: 5s
                  timeout: 3s
                  retries: 10
                volumes:
                  - mac_postgres_data:/var/lib/postgresql/data

              app:
                image: ${IMAGE}
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file:
                  - .env
                environment:
                  DB_URL: jdbc:postgresql://postgres:5432/mac
                ports:
                  - "8080:8080"

            volumes:
              mac_postgres_data:
            COMPOSE_EOF

            IMAGE="$IMAGE" docker compose up -d --remove-orphans
            docker image prune -f

            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Deployment healthy"
                exit 0
              fi
              echo "Waiting for app to become healthy... ($i/10)"
              sleep 5
            done

            echo "Health check failed after deployment"
            docker compose logs --tail 100 app
            exit 1
