services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mac
      POSTGRES_USER: mac
      POSTGRES_PASSWORD: mac
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mac -d mac"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mac_postgres_data:/var/lib/postgresql/data

volumes:
  mac_postgres_data:
